    <!-- Всплывающее уведомление -->
    <div id="toast" class="toast">Номер скопирован</div>

<script>
    function copyPhone(phone) {
        // 1. Пытаемся использовать современный метод (сработает в большинстве десктопных и новых мобильных браузеров)
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(phone).then(function () {
                showToast();
            }).catch(function () {
                // Если современный метод не сработал, используем резервный
                fallbackCopyText(phone);
            });
        } else {
            // 2. Если API недоступен (старый браузер или небезопасный контекст), сразу используем резервный
            fallbackCopyText(phone);
        }
    }

    // Резервный метод копирования
    function fallbackCopyText(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        
        // Делаем элемент невидимым, но доступным для взаимодействия
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.width = "2em";
        textArea.style.height = "2em";
        textArea.style.padding = "0";
        textArea.style.border = "none";
        textArea.style.outline = "none";
        textArea.style.boxShadow = "none";
        textArea.style.background = "transparent";
        
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            if (successful) {
                showToast();
            } else {
                console.error('Резервное копирование не удалось');
            }
        } catch (err) {
            console.error('Ошибка при копировании: ', err);
        }

        document.body.removeChild(textArea);
    }

    // Функция для показа уведомления
    function showToast() {
        var toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function () {
            toast.classList.remove('show');
        }, 2000);
    }
</script>
