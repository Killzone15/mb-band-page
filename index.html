<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержать группу MB BAND</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 25px;
            line-height: 1.2;
        }

        /* Кнопки доната */
        .donate-btn {
            display: block;
            width: 100%;
            max-width: 260px;
            margin: 0 auto 15px;
            padding: 14px 10px;
            background: transparent;
            border: 2px solid #000;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .donate-btn:hover {
            background: #000;
            color: #fff;
        }

        .social-title {
            font-size: 16px;
            color: #333;
            margin: 25px 0 15px;
        }

        /* Кнопки соцсетей */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 12px;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .social-btn:hover {
            opacity: 0.9;
        }

        .social-btn .icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn .icon svg {
            width: 100%;
            height: 100%;
            fill: #fff;
        }

        .social-btn .arrow {
            font-size: 20px;
            font-weight: 300;
        }

        /* Цвета соцсетей */
        .telegram {
            background-color: #2AABEE;
        }

        .max {
            background-color: #4DC3F7; /* Примерный цвет для MAX */
        }

        .vk {
            background-color: #0077FF;
        }

        /* Стили для кнопки копирования телефона (если нужна) */
        .phone-copy {
            display: inline-block;
            margin-top: 20px;
            color: #0077FF;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Поддержать группу<br>MB BAND</h1>

        <!-- Кнопки доната -->
        <a href="#" class="donate-btn">Через Т БАНК</a>
        <a href="#" class="donate-btn">Через Сбербанк</a>

        <p class="social-title">Наши социальные сети</p>

        <!-- Соцсети -->
        <!-- Telegram -->
        <a href="https://t.me/mbbandmusic" target="_blank" class="social-btn telegram">
            <div class="icon">
                <!-- Иконка Telegram -->
                <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            </div>
            <span>MB BAND | Telegram</span>
            <span class="arrow">›</span>
        </a>

        <!-- MAX (Мессенджер) -->
        <a href="https://max.ru/channel_Mbbandmusic" target="_blank" class="social-btn max">
            <div class="icon">
                <!-- Иконка MAX (примерная) -->
                <img src=".icons/MAX.svg" alt="VK" width="28" height="28">
            </div>
            <span>MB BAND | MAX</span>
            <span class="arrow">›</span>
        </a>

        <!-- VK -->
        <a href="https://vk.ru/mbbandmusic" target="_blank" class="social-btn vk">
    <div class="icon">
        <img src=".icons/vk.svg" alt="VK" width="28" height="28">
    </div>
    <span>Сообщество MB BAND</span>
    <span class="arrow">›</span>
</a>

        <!-- Пример кнопки копирования телефона (если нужно) -->
        <!-- <div class="phone-copy" onclick="copyPhone()">+7 (999) 123-45-67</div> -->
    </div>

    <script>
        // Функция для копирования телефона (если раскомментируете блок выше)
        function copyPhone() {
            const phone = '+79991234567';
            navigator.clipboard.writeText(phone).then(() => {
                alert('Номер скопирован!');
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }
    </script>

</body>
</html>
